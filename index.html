<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f9;color:#333;text-align:center;padding:8px;padding-top:env(safe-area-inset-top,8px);padding-bottom:env(safe-area-inset-bottom,8px);margin:0;-webkit-tap-highlight-color:transparent;font-size:17px}
.container{position:relative;max-width:1400px;margin:0 auto;background:#fff;padding:16px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.1)}
h2{margin-top:0;color:#0056b3;font-size:34px;letter-spacing:.3px;padding:0 110px}
.top-btn{position:absolute;top:16px;background:#f1f3f5;color:#333;border:1px solid #ccc;border-radius:10px;width:46px;height:46px;font-size:24px;font-weight:bold;cursor:pointer;line-height:1;padding:0;font-family:inherit;display:flex;align-items:center;justify-content:center}
.top-btn:active{background:#e2e6ea}
.share-btn{left:16px}
.settings-btn{right:16px}
.online-status{font-size:15px;padding:7px 15px;border-radius:16px;display:inline-block;margin-bottom:16px;font-weight:bold}
.online-status.online{background:#d4edda;color:#155724}
.online-status.loading{background:#fff3cd;color:#856404}
.top-row{display:flex;justify-content:center;align-items:center;margin-bottom:16px;font-size:19px}
.nav-row{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:nowrap}
.nav-row button#prevBtn,.nav-row button#nextBtn{padding:4px 14px;font-size:18px;min-width:44px;height:40px;line-height:1;border-radius:8px;font-weight:bold}
select,button{padding:13px 20px;font-size:17px;border-radius:9px;border:1px solid #ccc;background:#fff;cursor:pointer;font-family:inherit}
button{background:#007bff;color:#fff;border:none;font-weight:bold}
button:active{background:#0056b3}
button,.mode-btn,.theme-choice,.backup-option,.entry-item,.color-preset,.symbol-btn,.top-btn{transition:transform .1s ease, filter .1s ease, box-shadow .15s ease, background-color .15s ease}
button:active,.top-btn:active,.symbol-btn:active{transform:scale(0.94);filter:brightness(0.9)}
.mode-btn:active{transform:scale(0.95);filter:brightness(0.92)}
.theme-choice:active{transform:scale(0.96);filter:brightness(0.93)}
.backup-option:active{transform:scale(0.98);background:#e9ecef}
.color-preset:active{transform:scale(0.9)}
.entry-item:active{transform:scale(0.98)}
.mode-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;background:#e9ecef;padding:9px;border-radius:12px}
.mode-btn{background:#fff;color:#333;border:1px solid #ccc;font-size:16px;padding:12px 6px;font-weight:600;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-btn.active{background:#0056b3;color:#fff;border-color:#0056b3;font-weight:bold}
.color-picker-row{display:none;justify-content:center;align-items:center;gap:14px;margin-bottom:20px;padding:12px;background:#f1f3f5;border-radius:12px;border:1px dashed #999;flex-wrap:wrap}
.color-picker-row.active{display:flex}
.color-picker-row label{font-size:17px;font-weight:bold}
.color-picker-row input[type="color"]{width:56px;height:44px;border:2px solid #999;border-radius:9px;cursor:pointer;padding:0;background:#fff}
.color-presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.color-preset{width:44px;height:44px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999;cursor:pointer;padding:0;position:relative}
.color-preset.active{box-shadow:0 0 0 3px #0056b3}
.color-preset .preset-letter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:bold;color:#000;pointer-events:none}
.color-preset[data-color="#1E90FF"] .preset-letter,.color-preset[data-color="#FF4500"] .preset-letter{color:#fff}
#monthDisplay{font-size:26px;font-weight:bold;min-width:240px;display:inline-block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;touch-action:pan-y;max-width:none;margin:0 auto}
.calendar.anim-left{animation:cal-slide-left .28s ease}
.calendar.anim-right{animation:cal-slide-right .28s ease}
@keyframes cal-slide-left{from{opacity:.35;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes cal-slide-right{from{opacity:.35;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.day-header{font-weight:bold;font-size:20px;padding:12px 0;color:#555}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:clamp(22px,3vw,42px);font-weight:900;border:1px solid #eee;position:relative;cursor:pointer;line-height:1;-webkit-font-smoothing:antialiased;overflow:hidden;transition:transform .1s ease}
@media (min-width:900px){ .day{aspect-ratio:auto;height:130px} }
.day:active{transform:scale(0.96)}
.day.F{background-color:#FFD700;color:#000}
.day.S{background-color:#FF4500;color:#fff}
.day.N{background-color:#1E90FF;color:#fff}
.day._{background-color:#f9f9f9;color:#999}
.day.krank{background-color:#DDA0DD!important;color:#000!important;border:2px solid #8A2BE2}
.day.urlaub{background-color:#90EE90!important;color:#000!important;border:2px solid #228B22}
.day.sonstige{border:2px solid rgba(0,0,0,0.35);color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 3px rgba(0,0,0,0.7)}
.day.sonstige .date-num{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 2px rgba(0,0,0,0.7)}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{border:4px solid #000;box-shadow:0 0 10px rgba(0,0,0,0.5);font-weight:900}
.day.today .date-num{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;font-weight:900}
.day.feiertag{border:4px solid #CD7F32;animation:pulse-glow 3s infinite ease-in-out;z-index:2}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(205,127,50,0.9);border-color:#CD7F32}50%{box-shadow:0 0 18px 10px rgba(205,127,50,0.8);border-color:#FFA500}}
.day.ferien{border:3px dashed #17a2b8;z-index:1}
.ferien-marker{position:absolute;bottom:5px;left:8px;font-size:clamp(12px,1.6vw,17px);color:#17a2b8;font-weight:bold;background:#fff;border-radius:4px;padding:1px 6px;line-height:1.1;z-index:3}
.day .date-num{font-size:clamp(15px,1.6vw,22px);position:absolute;top:8px;left:10px;color:#555;font-weight:bold;line-height:1;z-index:3}
.day.sonstige .date-num{font-weight:bold}
.day .split-layer{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;border-radius:inherit;overflow:hidden}
.day .split-layer span{position:absolute;top:0;left:0;right:0;bottom:0;display:block;pointer-events:none}
.day .term-icon{position:absolute;transform:translate(-50%,-50%);font-size:clamp(22px,2.6vw,34px);line-height:1;z-index:2;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.75))}
.day .term-text{position:absolute;font-size:clamp(10px,1.1vw,14px);font-weight:bold;color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.95),0 1px 3px rgba(0,0,0,0.95);pointer-events:none;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-font-smoothing:antialiased}
.day .term-text.t-top{top:4px;left:50%;transform:translateX(-50%);max-width:calc(100% - 10px)}
.day .term-text.t-bottom{bottom:4px;left:50%;transform:translateX(-50%);max-width:calc(100% - 10px)}
.day .term-text.t-right{right:4px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%);max-height:calc(100% - 10px)}
.day .term-text.t-left{left:4px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);max-height:calc(100% - 10px)}
.sonstige-preview{position:absolute;bottom:6px;left:6px;right:6px;font-size:clamp(11px,1.3vw,15px);line-height:1.05;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;font-weight:bold;color:#fff;z-index:3}
.legend{margin-top:22px;font-size:15px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-box{width:20px;height:20px;border-radius:5px;border:1px solid #ccc}
.footer{margin-top:26px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
/* Jahresübersicht — плавное выезжание */

.overview-list{margin-bottom:14px}

.reminders-box{display:none;margin-top:22px;text-align:left;background:#eef6ff;padding:14px 18px;border-radius:12px;border-left:6px solid #0056b3;font-size:15px}

.reminders-box ul{margin:0;padding-left:0;list-style:none;font-size:15px;color:#333}

.paypal-note{margin-top:28px;padding:18px;background:#f0f4ff;border-radius:12px;border:1px solid #c3d4ff;text-align:center;font-size:15px;color:#333;line-height:1.6}

.paypal-btn{display:inline-block;background:#0070ba;color:#fff;padding:14px 24px;border-radius:10px;text-decoration:none;font-size:17px;font-weight:bold;transition:transform .1s ease, filter .1s ease}
.paypal-btn:active{transform:scale(0.95);filter:brightness(0.9)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:15px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:500px;width:100%;text-align:left;box-shadow:0 12px 44px rgba(0,0,0,0.3);max-height:95vh;overflow-y:auto;font-size:17px;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

.modal .modal-date{font-size:15px;color:#777;margin-bottom:16px}
.modal label{display:block;font-size:16px;font-weight:bold;margin-bottom:14px;color:#333}
.field-label{display:block;font-size:16px;font-weight:bold;margin-bottom:10px;color:#333}
.modal input[type="text"],.modal input[type="time"],.modal input[type="number"],.modal select{width:100%;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box;margin-top:6px;font-family:inherit}
.modal input[type="color"]{width:64px;height:46px;border:2px solid #999;border-radius:9px;cursor:pointer;padding:0;background:#fff;margin-top:6px;vertical-align:middle}
.symbol-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px;margin-bottom:16px}
.symbol-btn{font-size:26px;padding:8px 0;min-height:52px;border:1px solid #ccc;border-radius:9px;background:#fff;cursor:pointer;line-height:1;font-weight:normal;color:#333;touch-action:manipulation}
.symbol-btn.active{background:#0056b3;border-color:#0056b3;box-shadow:0 0 0 3px rgba(0,86,179,0.35)}
.symbol-btn:active{background:#e9ecef}
@media (max-width:420px){ .symbol-grid{grid-template-columns:repeat(6,1fr);gap:8px} .symbol-btn{font-size:26px;min-height:54px} }
.modal .checkbox-row{display:flex;align-items:flex-start;gap:12px;font-weight:normal;font-size:15.5px;color:#444;background:#f1f3f5;padding:14px;border-radius:10px;line-height:1.5;cursor:pointer}
.modal .checkbox-row input{margin-top:4px;transform:scale(1.4);flex-shrink:0;cursor:pointer}
.modal-buttons{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.modal-buttons button{flex:1;min-width:100px;padding:15px 12px;font-size:17px}
.modal-buttons a.donate-link{flex:1;min-width:100px;padding:15px 12px;font-size:17px;background:#0070ba;color:#fff;border-radius:9px;text-decoration:none;font-weight:bold;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:inherit;transition:transform .1s ease, filter .1s ease}

.notif-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:560px;width:calc(100% - 28px);background:#0056b3;color:#fff;padding:18px 48px 18px 20px;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,0.45);z-index:9999;font-size:17px;line-height:1.5;text-align:left;animation:notifIn .35s ease}
@keyframes notifIn{from{opacity:0;transform:translateX(-50%) translateY(-18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.notif-banner strong{display:block;font-size:18px;margin-bottom:6px}
.notif-banner-close{position:absolute;top:8px;right:12px;background:transparent;color:#fff;border:none;font-size:28px;line-height:1;padding:2px 12px;cursor:pointer;font-weight:bold;font-family:inherit}
.notif-info{font-size:13px;color:#666;background:#f1f3f5;padding:10px 12px;border-radius:8px;margin-top:14px;line-height:1.6;text-align:left}
.err-box{display:none;background:#f8d7da;color:#721c24;padding:12px;border-radius:9px;border:1px solid #dc3545;margin-bottom:12px;font-size:14px;text-align:left;font-family:monospace;white-space:pre-wrap}
.hint-row{font-size:13px;color:#666;margin-top:-8px;margin-bottom:14px;line-height:1.5}
.donate-text{font-size:16px;line-height:1.6;color:#444;margin:12px 0 8px 0}

.donate-amounts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px 0;justify-content:center}
.donate-amounts span{background:#f1f3f5;color:#333;border:1px solid #ccc;border-radius:22px;padding:8px 16px;font-size:15px;font-weight:600}

.help-btn{background:#17a2b8;display:block;width:100%;margin-top:10px;padding:16px;font-size:17px}

.theme-row{display:flex;gap:10px;margin-bottom:16px}
.theme-choice{flex:1;padding:16px 10px;font-size:16px;border-radius:10px;cursor:pointer;font-weight:b
