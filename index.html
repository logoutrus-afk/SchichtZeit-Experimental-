<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Schichtzeit</title>
<meta name="theme-color" content="#0056b3">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230056b3'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ESZ%3C/text%3E%3C/svg%3E">
<style>
/* --- ОСНОВНЫЕ СТИЛИ --- */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f9;color:#333;text-align:center;padding:8px;padding-top:env(safe-area-inset-top,8px);margin:0;-webkit-tap-highlight-color:transparent;font-size:16px}
.container{position:relative;max-width:1400px;margin:0 auto;background:#fff;padding:14px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.1)}
h2{margin:0 0 8px 0;color:#0056b3;font-size:32px}
.top-btn{background:#f1f3f5;color:#333;border:1px solid #ccc;border-radius:10px;width:40px;height:40px;font-size:20px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.online-status{font-size:14px;padding:5px 11px;border-radius:16px;display:inline-block;font-weight:bold}
.online-status.online{background:#d4edda;color:#155724}
.top-row{display:flex;justify-content:center;align-items:center;margin-bottom:10px;font-size:16px;gap:10px;flex-wrap:wrap}
select,button{padding:10px 15px;font-size:16px;border-radius:9px;border:1px solid #ccc;background:#fff;cursor:pointer;font-family:inherit}
button{background:#007bff;color:#fff;border:none;font-weight:bold}
.nav-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#monthDisplay{font-size:22px;font-weight:bold;min-width:180px;text-align:center}
.mode-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;background:#e9ecef;padding:8px;border-radius:12px}
.mode-btn{background:#fff;color:#333;border:1px solid #ccc;font-size:15px;padding:10px 4px;font-weight:600;border-radius:9px}
.mode-btn.active{background:#0056b3;color:#fff;border-color:#0056b3}

/* --- СЕТКА КАЛЕНДАРЯ И ВИДЫ --- */
.calendar-wrap{position:relative;z-index:1;overflow-x:auto;}
.calendar{display:grid;gap:4px;position:relative;z-index:10;margin:0 auto;transition:all 0.3s ease;}
.day-header{font-weight:bold;font-size:14px;padding:5px 0;color:#555;text-transform:uppercase;}

/* Месяц (7 колонок) */
.calendar.view-month { grid-template-columns: repeat(7, 1fr); }
.calendar.view-month .day { aspect-ratio: 1/1.2; padding:2px; }
.calendar.view-month .day .date-num { font-size:14px; top:4px; left:6px; }

/* Неделя (7 колонок, высокие ячейки) */
.calendar.view-week { grid-template-columns: repeat(7, 1fr); }
.calendar.view-week .day { min-height: 60vh; padding: 5px; }

/* 4 дня */
.calendar.view-4days { grid-template-columns: repeat(4, 1fr); }
.calendar.view-4days .day { min-height: 60vh; padding: 5px; }

/* 1 день */
.calendar.view-1day { grid-template-columns: 1fr; }
.calendar.view-1day .day { min-height: 65vh; padding: 10px; }

.day{display:flex;flex-direction:column;border-radius:8px;border:1px solid #eee;position:relative;cursor:pointer;overflow:hidden;user-select:none;background:#fff;box-sizing:border-box;}
.day.F,.day.T{background-color:#FFD700;color:#000}
.day.S{background-color:#FF4500;color:#fff}
.day.N{background-color:#1E90FF;color:#fff}
.day._{background-color:#f9f9f9;color:#999}
.day.krank{background-color:#DDA0DD!important;color:#000!important}
.day.urlaub{background-color:#90EE90!important;color:#000!important}
.day.einbringer{background-color:#FF69B4!important;color:#fff!important}
.day.sonstige{border:2px solid rgba(0,0,0,0.35);color:#fff;}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{border:3px solid #0d47a1;box-shadow:0 0 10px rgba(13,71,161,0.4);z-index:6;}
.day.feiertag{border:3px solid #CD7F32;z-index:3;}
.day.ferien{border:2px dashed #17a2b8;}

.day .date-num{position:absolute;top:4px;left:6px;font-weight:bold;z-index:3;background:rgba(255,255,255,0.6);padding:2px 6px;border-radius:6px;color:#333;font-size:14px;}
body.dark .day .date-num{background:rgba(0,0,0,0.5);color:#fff}

/* Контейнер для терминов внутри дня */
.terms-container { margin-top: 25px; display: flex; flex-direction: column; gap: 3px; width: 100%; z-index: 2; overflow-y: auto; }
.term-block { font-size: 11px; padding: 3px 5px; border-radius: 4px; color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.term-block.shift-block { background: rgba(0,0,0,0.3); border-left: 3px solid rgba(255,255,255,0.8); }

.calendar.view-week .terms-container, .calendar.view-4days .terms-container, .calendar.view-1day .terms-container { gap: 5px; margin-top: 30px; }
.calendar.view-week .term-block, .calendar.view-4days .term-block, .calendar.view-1day .term-block { font-size: 13px; padding: 6px 8px; white-space: normal; }

/* --- МОДАЛЬНЫЕ ОКНА --- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:15px;}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 10px;color:#0056b3;font-size:20px}
.modal label{display:block;font-size:15px;font-weight:bold;margin-bottom:12px;color:#333}
.modal input[type="text"],.modal input[type="time"],.modal input[type="number"],.modal input[type="date"],.modal select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-top:4px;box-sizing:border-box;}
.modal .checkbox-row{display:flex;flex-direction:column;gap:8px;font-weight:normal;background:#f8f9fa;padding:12px;border-radius:8px;border:1px solid #eee;margin-bottom:12px;}
.notif-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.notif-row select { width: auto; flex: 1; padding: 6px; font-size: 14px; }

.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-buttons button{flex:1;padding:12px}
.symbol-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:15px}
.symbol-btn{font-size:22px;padding:6px 0;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;}
.symbol-btn.active{background:#0056b3;border-color:#0056b3;color:#fff;}

/* --- ТЕМНАЯ ТЕМА --- */
body.dark{background:#121212;color:#e0e0e0}
body.dark .container{background:#1e1e1e;}
body.dark h2{color:#6ab0ff}
body.dark .calendar .day._{background:#2a2a2a;border-color:#333;color:#666}
body.dark .calendar .day.empty{background:transparent}
body.dark .term-block{box-shadow:none;}
body.dark select,body.dark button:not(.mode-btn):not(.top-btn){background:#333;color:#fff;border-color:#555}
body.dark .mode-controls{background:#2a2a2a}
body.dark .mode-btn{background:#1e1e1e;color:#ccc;border-color:#444}
body.dark .mode-btn.active{background:#0056b3;color:#fff}
body.dark .modal{background:#1e1e1e;color:#fff}
body.dark .modal h3{color:#6ab0ff}
body.dark .modal label{color:#ddd}
body.dark .modal input,body.dark .modal select{background:#333;color:#fff;border-color:#555}
body.dark .modal .checkbox-row{background:#2a2a2a;border-color:#444}
body.dark .symbol-btn{background:#333;color:#fff;border-color:#555}

@media (max-width:600px){
  .calendar.view-month .day{border-radius:4px;}
  .calendar.view-month .date-num{font-size:11px;top:2px;left:2px;padding:1px 4px;}
  .terms-container{margin-top:18px;}
  .term-block{font-size:9px;padding:1px 3px;}
  #monthDisplay{font-size:18px;min-width:120px;}
}
</style>
</head>
<body>
<div class="container" id="mainContainer">
<h2>Schichtzeit</h2>
<div class="top-row">
  <span id="onlineStatus" class="online-status online">Bereit</span>
  <label>Schicht:<select id="groupSelect"></select></label>
</div>

<div class="nav-row">
  <button class="top-btn" id="prevBtn">&larr;</button>
  <span id="monthDisplay"></span>
  <button class="top-btn" id="nextBtn">&rarr;</button>
  <select id="viewSelect" style="padding:8px; font-size:14px;">
    <option value="month">Monat</option>
    <option value="week">Woche</option>
    <option value="4days">4 Tage</option>
    <option value="1day">Tag</option>
  </select>
</div>

<div class="mode-controls">
  <button class="mode-btn active" data-mode="normal">Normal</button>
  <button class="mode-btn" data-mode="krank">Krank</button>
  <button class="mode-btn" data-mode="urlaub">Urlaub</button>
  <button class="mode-btn" data-mode="sonstige">Termin</button>
</div>

<div class="calendar-wrap">
  <div class="calendar view-month" id="calendar"></div>
</div>

<div style="margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
  <button id="settingsBtn" style="background:#6c757d;">⚙️ Einstellungen</button>
  <button id="backupBtn" style="background:#6f42c1;">💾 Backup / ICS</button>
</div>

</div>

<!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ/РЕДАКТИРОВАНИЯ ТЕРМИНА -->
<div class="modal-overlay" id="entryModal"><div class="modal">
    <h3 id="modalTitle">Eintrag</h3>
    <div id="modalDate" style="font-size:14px; color:#666; margin-bottom:15px;"></div>
    
    <label>Beschreibung<input type="text" id="entryText" maxlength="40" placeholder="z.B. Arzttermin"></label>
    <label>Uhrzeit (Optional)<input type="time" id="entryTime"></label>
    
    <label>Farbe<input type="color" id="entryColor" value="#4285F4" style="width:50px; height:30px; padding:0; vertical-align:middle;"></label>
    
    <label class="checkbox-row" for="entryNotify">
        <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="entryNotify" style="transform:scale(1.2);">
            <span>Erinnerung senden</span>
        </div>
        <div class="notif-row">
            <select id="notify1">
                <option value="5">5 Min</option>
                <option value="10">10 Min</option>
                <option value="30">30 Min</option>
                <option value="60">1 Std</option>
                <option value="120">2 Std</option>
                <option value="1440" selected>1 Tag</option>
            </select>
            <span>und</span>
            <select id="notify2">
                <option value="0">keine 2.</option>
                <option value="5">5 Min</option>
                <option value="10">10 Min</option>
                <option value="30">30 Min</option>
                <option value="60">1 Std</option>
            </select>
            <span>vorher</span>
        </div>
    </label>

    <div class="modal-buttons">
        <button id="modalDeleteBtn" style="background:#dc3545; display:none;">Löschen</button>
        <button id="modalCancelBtn" style="background:#6c757d;">Abbrechen</button>
        <button id="modalSaveBtn" style="background:#007bff;">Speichern</button>
    </div>
</div></div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal"><div class="modal">
    <h3>Einstellungen</h3>
    
    <label>Schichtsystem
        <select id="shiftSystemSelect">
            <option value="5">5-Schicht (F/S/N)</option>
            <option value="4vk">4-Schicht Vollkonti (F/S/N)</option>
            <option value="4x12">4×12-Schicht (T/N)</option>
            <option value="3x12">3×12-Schicht (T/N)</option>
            <option value="blank">Leer (ohne Schicht)</option>
        </select>
    </label>

    <label style="display:flex; align-items:center; gap:10px; margin-top:15px; background:#f8f9fa; padding:10px; border-radius:8px; border:1px solid #eee;">
        <input type="checkbox" id="alwaysShowFerien" style="transform:scale(1.3);">
        <span>Ferien immer anzeigen</span>
    </label>
    <div style="font-size:12px; color:#777; margin-top:5px; margin-bottom:15px;">Zeigt Schulferien (Bayern) auch außerhalb der aktuellen Saison an.</div>

    <label style="display:flex; align-items:center; gap:10px; margin-top:15px; background:#f8f9fa; padding:10px; border-radius:8px; border:1px solid #eee;">
        <input type="checkbox" id="darkModeToggle" style="transform:scale(1.3);">
        <span>Dark Mode (Dunkles Design)</span>
    </label>

    <div class="modal-buttons" style="margin-top:25px;">
        <button id="settingsCloseBtn" style="background:#007bff;">Speichern & Schließen</button>
    </div>
</div></div>

<!-- МОДАЛЬНОЕ ОКНО BACKUP -->
<div class="modal-overlay" id="backupModal"><div class="modal">
    <h3>Backup & Export</h3>
    <p style="font-size:14px; color:#666; margin-bottom:20px;">Sichere deine Daten oder exportiere sie für Google Calendar.</p>
    <button id="backupGoogleIcsBtn" style="background:#4285F4; width:100%; margin-bottom:10px; padding:15px;">📅 Für Google Calendar exportieren (.ics)</button>
    <button id="backupCloseBtn" style="background:#6c757d; width:100%;">Schließen</button>
</div></div>

<script>
(function(){
try {
    // --- БАЗОВЫЕ ПЕРЕМЕННЫЕ ---
    var currentDate = new Date();
    currentDate.setDate(1); // Начинаем с 1-го числа текущего месяца
    var actualToday = new Date();
    actualToday.setHours(0,0,0,0);
    
    var currentView = localStorage.getItem('sz_view') || 'month'; // month, week, 4days, 1day
    var currentMode = 'normal';
    var shiftSystem = localStorage.getItem('sz_shiftSystem') || '5';
    var alwaysShowFerien = localStorage.getItem('sz_alwaysFerien') === 'true';
    var isDarkMode = localStorage.getItem('sz_darkMode') === 'true';

    // Данные пользователя (симуляция базы данных)
    var userData = JSON.parse(localStorage.getItem('sz_data')) || {
        shifts: {}, // формат: 'YYYY-MM-DD': 'F' | 'S' | 'N' | 'Krank' | 'Urlaub'
        entries: {} // формат: 'YYYY-MM-DD': [ {id, text, time, color, notify, n1, n2} ]
    };

    function saveData() {
        localStorage.setItem('sz_data', JSON.stringify(userData));
    }

    // --- ЛОГИКА СМЕН ---
    // Упрощенный цикл для примера (5-сменный)
    function getShift(date, group) {
        if(shiftSystem === 'blank') return '_';
        // Базовая дата для расчета (1 окт 2026)
        var base = new Date(2026, 9, 1).getTime();
        var current = date.getTime();
        var diffDays = Math.floor((current - base) / (1000 * 60 * 60 * 24));
        
        // Пример 5-сменного цикла (35 дней)
        var cycle = ['F','F','N','N','N','_','_','_','S','S','S','_','F','F','N','N','_','_','_','S','S','S','_','F','F','F','N','N','_','_','_','_','_','_','_'];
        // Сдвиг для групп (1-5)
        var offsets = { '1': 29, '2': 1, '3': 8, '4': 15, '5': 22 };
        var offset = offsets[group] || 0;
        
        var idx = (diffDays + offset) % 35;
        if(idx < 0) idx += 35;
        
        return cycle[idx];
    }

    // --- ОТРИСОВКА КАЛЕНДАРЯ ---
    function renderCalendar() {
        var cal = document.getElementById('calendar');
        cal.className = 'calendar view-' + currentView;
        cal.innerHTML = '';
        
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();
        
        var firstDayOfMonth = new Date(year, month, 1);
        var lastDayOfMonth = new Date(year, month + 1, 0);
        
        var startDayOffset = firstDayOfMonth.getDay() === 0 ? 6 : firstDayOfMonth.getDay() - 1;
        
        var daysToDraw = [];
        
        if (currentView === 'month') {
            document.getElementById('monthDisplay').textContent = firstDayOfMonth.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
            for (var i = 0; i < startDayOffset; i++) daysToDraw.push(null);
            for (var i = 1; i <= lastDayOfMonth.getDate(); i++) {
                daysToDraw.push(new Date(year, month, i));
            }
            // Добиваем до полной сетки
            while(daysToDraw.length % 7 !== 0) daysToDraw.push(null);
        } 
        else if (currentView === 'week') {
            var startOfWeek = new Date(currentDate);
            var day = startOfWeek.getDay() || 7; 
            if (day !== 1) startOfWeek.setHours(-24 * (day - 1));
            document.getElementById('monthDisplay').textContent = "Woche ab " + startOfWeek.toLocaleDateString('de-DE');
            for (var i = 0; i < 7; i++) {
                var d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                daysToDraw.push(d);
            }
        }
        else if (currentView === '4days') {
            document.getElementById('monthDisplay').textContent = "4 Tage ab " + currentDate.toLocaleDateString('de-DE');
            for (var i = 0; i < 4; i++) {
                var d = new Date(currentDate);
                d.setDate(currentDate.getDate() + i);
                daysToDraw.push(d);
            }
        }
        else if (currentView === '1day') {
            document.getElementById('monthDisplay').textContent = currentDate.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
            daysToDraw.push(new Date(currentDate));
        }

        // Заголовки дней недели
        if (currentView === 'month' || currentView === 'week') {
            var dayNames = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
            dayNames.forEach(function(n) {
                var h = document.createElement('div');
                h.className = 'day-header';
                h.textContent = n;
                cal.appendChild(h);
            });
        } else if (currentView === '4days') {
            // Для 4 дней заголовки не обязательны, дата будет внутри
        }

        // Рисуем ячейки
        var group = document.getElementById('groupSelect').value;
        
        daysToDraw.forEach(function(dateObj) {
            var el = document.createElement('div');
            
            if (!dateObj) {
                el.className = 'day empty';
                cal.appendChild(el);
                return;
            }

            var dateKey = dateObj.toISOString().split('T')[0];
            el.className = 'day';
            
            if (dateObj.getTime() === actualToday.getTime()) el.classList.add('today');
            
            // Смена
            var shift = getShift(dateObj, group);
            if (shift !== '_') el.classList.add(shift);
            else el.classList.add('_');

            // Пользовательские статусы
            var status = userData.shifts[dateKey];
            if (status === 'Krank') el.classList.add('krank');
            if (status === 'Urlaub') el.classList.add('urlaub');

            // Номер дня
            var num = document.createElement('div');
            num.className = 'date-num';
            if (currentView === '1day' || currentView === '4days') {
                num.textContent = dateObj.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' });
            } else {
                num.textContent = dateObj.getDate();
            }
            el.appendChild(num);

            // Контейнер для терминов
            var termsBox = document.createElement('div');
            termsBox.className = 'terms-container';
            
            // Добавляем смену как термин (чтобы было видно)
            if (shift !== '_' && shiftSystem !== 'blank') {
                var shiftTerm = document.createElement('div');
                shiftTerm.className = 'term-block shift-block';
                var shiftName = shift === 'F' ? 'Frühschicht' : (shift === 'S' ? 'Spätschicht' : (shift === 'N' ? 'Nachtschicht' : shift));
                shiftTerm.textContent = shiftName + ' (' + shift + ')';
                if(shift === 'F') shiftTerm.style.backgroundColor = '#b8860b';
                if(shift === 'S') shiftTerm.style.backgroundColor = '#cd3700';
                if(shift === 'N') shiftTerm.style.backgroundColor = '#104e8b';
                termsBox.appendChild(shiftTerm);
            }

            // Добавляем пользовательские события
            var events = userData.entries[dateKey] || [];
            events.forEach(function(ev) {
                var term = document.createElement('div');
                term.className = 'term-block';
                term.style.backgroundColor = ev.color || '#4285F4';
                var timeStr = ev.time ? ev.time + ' ' : '';
                term.textContent = timeStr + (ev.text || 'Termin');
                termsBox.appendChild(term);
            });

            el.appendChild(termsBox);

            // Обработчик клика
            el.addEventListener('click', function() {
                if (currentMode === 'normal') {
                    openEntryModal(dateObj, dateKey);
                } else if (currentMode === 'krank') {
                    userData.shifts[dateKey] = (userData.shifts[dateKey] === 'Krank') ? null : 'Krank';
                    saveData(); renderCalendar();
                } else if (currentMode === 'urlaub') {
                    userData.shifts[dateKey] = (userData.shifts[dateKey] === 'Urlaub') ? null : 'Urlaub';
                    saveData(); renderCalendar();
                }
            });

            cal.appendChild(el);
        });
    }

    // --- МОДАЛЬНОЕ ОКНО ТЕРМИНА ---
    var activeDateKey = null;
    var activeEntryId = null;

    function openEntryModal(dateObj, dateKey) {
        activeDateKey = dateKey;
        activeEntryId = null;
        
        document.getElementById('modalDate').textContent = dateObj.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('entryText').value = '';
        document.getElementById('entryTime').value = '';
        document.getElementById('entryColor').value = '#4285F4';
        document.getElementById('entryNotify').checked = false;
        document.getElementById('notify1').value = '1440';
        document.getElementById('notify2').value = '0';
        
        // Скрываем кнопку удаления для нового события
        document.getElementById('modalDeleteBtn').style.display = 'none';
        
        document.getElementById('entryModal').classList.add('active');
    }

    document.getElementById('modalCancelBtn').addEventListener('click', function() {
        document.getElementById('entryModal').classList.remove('active');
    });

    document.getElementById('modalSaveBtn').addEventListener('click', function() {
        var text = document.getElementById('entryText').value.trim();
        var time = document.getElementById('entryTime').value;
        var color = document.getElementById('entryColor').value;
        var notify = document.getElementById('entryNotify').checked;
        var n1 = document.getElementById('notify1').value;
        var n2 = document.getElementById('notify2').value;

        if (!userData.entries[activeDateKey]) userData.entries[activeDateKey] = [];

        userData.entries[activeDateKey].push({
            id: Date.now().toString(),
            text: text,
            time: time,
            color: color,
            notify: notify,
            n1: n1,
            n2: n2
        });

        saveData();
        document.getElementById('entryModal').classList.remove('active');
        renderCalendar();
    });

    // --- НАВИГАЦИЯ ---
    document.getElementById('prevBtn').addEventListener('click', function() {
        if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
        else if (currentView === 'week') currentDate.setDate(currentDate.getDate() - 7);
        else if (currentView === '4days') currentDate.setDate(currentDate.getDate() - 4);
        else if (currentView === '1day') currentDate.setDate(currentDate.getDate() - 1);
        renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', function() {
        if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
        else if (currentView === 'week') currentDate.setDate(currentDate.getDate() + 7);
        else if (currentView === '4days') currentDate.setDate(currentDate.getDate() + 4);
        else if (currentView === '1day') currentDate.setDate(currentDate.getDate() + 1);
        renderCalendar();
    });

    document.getElementById('viewSelect').addEventListener('change', function(e) {
        currentView = e.target.value;
        localStorage.setItem('sz_view', currentView);
        // Сбрасываем дату на начало, чтобы не улететь в пустоту
        currentDate = new Date(); 
        renderCalendar();
    });

    // --- РЕЖИМЫ (Normal, Krank, Urlaub) ---
    document.querySelectorAll('.mode-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.getAttribute('data-mode');
        });
    });

    // --- НАСТРОЙКИ ---
    document.getElementById('settingsBtn').addEventListener('click', function() {
        document.getElementById('shiftSystemSelect').value = shiftSystem;
        document.getElementById('alwaysShowFerien').checked = alwaysShowFerien;
        document.getElementById('darkModeToggle').checked = isDarkMode;
        document.getElementById('settingsModal').classList.add('active');
    });

    document.getElementById('settingsCloseBtn').addEventListener('click', function() {
        shiftSystem = document.getElementById('shiftSystemSelect').value;
        alwaysShowFerien = document.getElementById('alwaysShowFerien').checked;
        isDarkMode = document.getElementById('darkModeToggle').checked;
        
        localStorage.setItem('sz_shiftSystem', shiftSystem);
        localStorage.setItem('sz_alwaysFerien', alwaysShowFerien);
        localStorage.setItem('sz_darkMode', isDarkMode);

        if(isDarkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');

        document.getElementById('settingsModal').classList.remove('active');
        renderCalendar();
    });

    // --- ИНИЦИАЛИЗАЦИЯ ---
    function init() {
        // Восстановление темной темы
        if(isDarkMode) document.body.classList.add('dark');
        
        // Заполнение групп смен
        var groupSel = document.getElementById('groupSelect');
        if (shiftSystem === '5') groupSel.innerHTML = '<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>';
        else if (shiftSystem === '4vk' || shiftSystem === '4x12') groupSel.innerHTML = '<option>A</option><option>B</option><option>C</option><option>D</option>';
        else if (shiftSystem === '3x12') groupSel.innerHTML = '<option>I</option><option>II</option><option>III</option>';
        else groupSel.innerHTML = '<option>-</option>';

        document.getElementById('viewSelect').value = currentView;
        renderCalendar();
    }

    init();

} catch(e) {
    alert("Ошибка инициализации: " + e.message);
    console.error(e);
}
})();
</script>
</body>
</html>
